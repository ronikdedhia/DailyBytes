name: Scheduled jobs

# The backend runs on Render's free tier, which sleeps when idle. Once a day
# this wakes it and runs the daily slot (every job, in order); the server
# then sleeps again. Vercel Cron (frontend/vercel.json) wakes it at 08:50 UTC
# as a backup if this run is late or skipped.
#
# Setup (repo Settings → Secrets and variables → Actions):
#   secret   PIPELINE_SECRET  same value as the backend's PIPELINE_SECRET
#   variable BACKEND_URL      e.g. https://daily-bytes-ai.onrender.com
#
# If a run fails, GitHub emails whoever last changed this schedule.

on:
  schedule:
    - cron: '30 8 * * *'   # 2:00 PM IST
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (daily = the whole slot)
        required: true
        default: daily
        type: choice
        options: [daily, news-data, rss, markets, embed-backfill, newsletter, telegram-digest, telegram-weekly, cleanup, health-check]

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wake backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "BACKEND_URL variable is not set"; exit 1; }
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 "$BACKEND_URL/health"
          echo

      - name: Run ${{ inputs.job || 'daily' }}
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          JOB: ${{ inputs.job || 'daily' }}
        # No retry: the request waits for the jobs, and a retry could overlap them.
        run: |
          curl -sS --fail-with-body --max-time 1500 -X POST "$BACKEND_URL/api/cron/$JOB" \
            -H "x-pipeline-secret: $PIPELINE_SECRET"
          echo
